<!DOCTYPE html>
<html>
    <head>
        <title>Productos existentes</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script>
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            const responseAPI = {
                "status":200,
                "message": "Productos Obtenidos",
                "data": [{"id": "1","nombre": "Martillo"},{"id": "2","nombre": "Tijera"}]
            };
            function cargarProductos(){
                let cmb = document.getElementById("cmbProducto");
                responseAPI.data.forEach((prod) => {
                    let opt = document.createElement("option");
                    opt.setAttribute("value", prod.id);
                    opt.innerText = prod.nombre;
                    cmb.appendChild(opt);
                });
                
            }
        </script>
    </head>
    <body onload="cargarProductos();">
        <div class="container-fluid mt-3" >
            <p style="text-align: center;">Productos cargados desde antes.</p>
        </div>
        <hr>
        <div style="text-align: center; width:300px; background-color: darkgrey; margin: auto;">
            <p>Productos disponibles</p>
            <select id="cmbProducto" name="cmbProducto"></select>
        </div>
        <a href="index.html">Primera Prueba</a>
    </body>
</html>
