<!DOCTYPE html>
<html>
    <head>
        <title>Añadir Productos</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script>
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            function agregarProducto(){
                let cmb = document.getElementById("cmbProducto");
                let id = document.getElementById("txtId").value;
                let nombre = document.getElementById("txtNombre").value;
                let opt = document.createElement("option");
                opt.setAttribute("value", id);
                opt.innerText = nombre;
                cmb.appendChild(opt);
            }
        </script>
    </head>
    <body>
        <div class="container-fluid mt-3" >
            <p style="text-align: center;">Añadir productos a una lista</p>
        </div>
        <hr>
        
        <div style="text-align: center; width:300px; background-color: darkgrey; margin: auto;">
            Id Producto: <br>
            <input id="txtId" type="text" /><br>
            Nombre producto: <br>
            <input id="txtNombre" type="text" /><br>
            <button type="button" onclick="agregarProducto();">Agregar</button><br>
            <div>
                <select id="cmbProducto" name="cmbProducto"></select>
            </div>
        </div>
        
        <a href="index2.html"> Segunda prueba</a><br>
    </body>
</html>
